<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;">
  <defs>
    <linearGradient id="mx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2748"/>
      <stop offset="100%" stop-color="#0D1224"/>
    </linearGradient>
    <radialGradient id="mx-spot" cx="0.45" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#22F0FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22F0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mx-gap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC661" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFC661" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="600" height="240" fill="url(#mx-bg)"/>
  <rect width="600" height="240" fill="url(#mx-spot)"/>

  <!-- FX fairness — bank rate vs mid-market, spread surfaced -->

  <!-- LEFT: transaction card -->
  <g transform="translate(36, 38)">
    <rect x="0" y="0" width="150" height="164" fill="#1A2244" stroke="#2E3865" stroke-width="1" rx="3"/>
    <text x="12" y="20" font-family="ui-monospace,monospace" font-size="9" letter-spacing="0.12em" fill="#22F0FF">WIRE TRANSFER</text>
    <line x1="12" y1="28" x2="138" y2="28" stroke="#2E3865" stroke-width="1"/>

    <text x="12" y="46" font-family="ui-monospace,monospace" font-size="11" fill="#FFFFFF">USD → EUR</text>
    <text x="12" y="60" font-family="ui-monospace,monospace" font-size="8.5" fill="#8E96B5">250,000.00 sent</text>

    <g font-family="ui-monospace,monospace" font-size="8" fill="#DCE0EE">
      <text x="12" y="84">bank rate</text>   <text x="138" y="84" text-anchor="end" fill="#FFC661">0.9012</text>
      <text x="12" y="100">mid-market</text> <text x="138" y="100" text-anchor="end" fill="#FFFFFF">0.9248</text>
      <text x="12" y="116">stated fee</text> <text x="138" y="116" text-anchor="end" fill="#FFFFFF">0.00</text>
      <text x="12" y="132">value date</text> <text x="138" y="132" text-anchor="end" fill="#FFFFFF">T+1</text>
      <text x="12" y="148">received</text>   <text x="138" y="148" text-anchor="end" fill="#FFFFFF">225,300</text>
    </g>
  </g>

  <!-- MIDDLE: rate chart -->
  <g stroke="#2E3865" stroke-width="0.4" opacity="0.5">
    <line x1="210" y1="60" x2="390" y2="60"/>
    <line x1="210" y1="100" x2="390" y2="100"/>
    <line x1="210" y1="140" x2="390" y2="140"/>
    <line x1="210" y1="180" x2="390" y2="180"/>
  </g>
  <g font-family="ui-monospace,monospace" font-size="7.5" fill="#5A6182">
    <text x="210" y="52">MID-MARKET</text>
    <text x="210" y="196">BANK QUOTE</text>
  </g>

  <!-- Spread band between the two lines -->
  <path d="M 210,78 L 240,74 L 270,80 L 300,70 L 330,76 L 360,66 L 390,72
           L 390,152 L 360,146 L 330,156 L 300,150 L 270,160 L 240,154 L 210,158 Z"
        fill="url(#mx-gap)"/>
  <path d="M 210,78 L 240,74 L 270,80 L 300,70 L 330,76 L 360,66 L 390,72"
        fill="none" stroke="#22F0FF" stroke-width="1.6"/>
  <path d="M 210,158 L 240,154 L 270,160 L 300,150 L 330,156 L 360,146 L 390,152"
        fill="none" stroke="#FFC661" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Spread marker -->
  <g stroke="#DCE0EE" stroke-width="0.8">
    <line x1="360" y1="68" x2="360" y2="144"/>
    <line x1="355" y1="68" x2="365" y2="68"/>
    <line x1="355" y1="144" x2="365" y2="144"/>
  </g>
  <circle cx="360" cy="66" r="3" fill="#22F0FF">
    <animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="314" y="110" font-family="ui-monospace,monospace" font-size="8.5" fill="#FFC661">SPREAD</text>

  <!-- RIGHT: fairness panel -->
  <g transform="translate(420, 30)" font-family="ui-monospace,monospace" font-size="9.5" fill="#DCE0EE">
    <text x="0" y="0" font-size="10" letter-spacing="0.12em" fill="#22F0FF">RATE CHECK</text>

    <g transform="translate(0, 18)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">MARKUP</text>
      <text x="150" y="9" font-size="8.5" text-anchor="end" fill="#FFC661">2.55%</text>
    </g>
    <g transform="translate(0, 38)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">HIDDEN COST</text>
      <text x="150" y="9" font-size="8.5" text-anchor="end" fill="#FFFFFF">€5,900</text>
    </g>
    <g transform="translate(0, 58)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">PEER BANKS</text>
      <rect x="72" y="2" width="58" height="6" fill="#2E3865" rx="1"/>
      <rect x="72" y="2" width="22" height="6" fill="#22F0FF" rx="1"/>
      <text x="150" y="9" font-size="8.5" text-anchor="end" fill="#FFFFFF">0.9%</text>
    </g>
    <g transform="translate(0, 78)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">THIS QUOTE</text>
      <rect x="72" y="2" width="58" height="6" fill="#2E3865" rx="1"/>
      <rect x="72" y="2" width="58" height="6" fill="#FFC661" rx="1"/>
      <text x="150" y="9" font-size="8.5" text-anchor="end" fill="#FFFFFF">2.6%</text>
    </g>

    <line x1="0" y1="100" x2="150" y2="100" stroke="#2E3865" stroke-width="1"/>

    <g transform="translate(0, 120)">
      <text x="0" y="0" font-size="8.5" letter-spacing="0.1em" fill="#22F0FF">VERDICT</text>
      <text x="0" y="22" font-size="20" font-weight="500" fill="#FFFFFF">ABOVE FAIR</text>
      <text x="0" y="38" font-size="8" fill="#8E96B5">EVIDENCE: 3 SOURCES</text>
    </g>

    <line x1="0" y1="160" x2="150" y2="160" stroke="#2E3865" stroke-width="1"/>
    <text x="0" y="178" font-size="8" letter-spacing="0.1em" fill="#8E96B5">FX · MID-MARKET · SPREAD</text>
  </g>
</svg>
