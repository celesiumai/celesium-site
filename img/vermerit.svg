<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;">
  <defs>
    <linearGradient id="vm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2748"/>
      <stop offset="100%" stop-color="#0D1224"/>
    </linearGradient>
    <radialGradient id="vm-spot" cx="0.35" cy="0.6" r="0.7">
      <stop offset="0%" stop-color="#22F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22F0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="240" fill="url(#vm-bg)"/>
  <rect width="600" height="240" fill="url(#vm-spot)"/>

  <!-- Applicant review fairness — reviewer scores compared, drift flagged -->

  <!-- LEFT: cohort card -->
  <g transform="translate(36, 38)">
    <rect x="0" y="0" width="150" height="164" fill="#1A2244" stroke="#2E3865" stroke-width="1" rx="3"/>
    <text x="12" y="20" font-family="ui-monospace,monospace" font-size="9" letter-spacing="0.12em" fill="#22F0FF">REVIEW CYCLE</text>
    <line x1="12" y1="28" x2="138" y2="28" stroke="#2E3865" stroke-width="1"/>

    <text x="12" y="46" font-family="ui-monospace,monospace" font-size="11" fill="#FFFFFF">Cohort 2026</text>
    <text x="12" y="60" font-family="ui-monospace,monospace" font-size="8.5" fill="#8E96B5">1,240 applicants</text>

    <g font-family="ui-monospace,monospace" font-size="8" fill="#DCE0EE">
      <text x="12" y="84">reviewers</text>     <text x="138" y="84" text-anchor="end" fill="#FFFFFF">4</text>
      <text x="12" y="100">rubric items</text> <text x="138" y="100" text-anchor="end" fill="#FFFFFF">9</text>
      <text x="12" y="116">scores logged</text> <text x="138" y="116" text-anchor="end" fill="#FFFFFF">11,160</text>
      <text x="12" y="132">off-rubric notes</text> <text x="138" y="132" text-anchor="end" fill="#FFC661">17</text>
      <text x="12" y="148">score drift</text>  <text x="138" y="148" text-anchor="end" fill="#FFC661">1</text>
    </g>
  </g>

  <!-- MIDDLE: reviewer score strips -->
  <g font-family="ui-monospace,monospace" font-size="8" fill="#8E96B5">
    <text x="210" y="74">R1</text>
    <text x="210" y="104">R2</text>
    <text x="210" y="134">R3</text>
    <text x="210" y="164">R4</text>
  </g>
  <g stroke="#2E3865" stroke-width="1">
    <line x1="232" y1="71" x2="392" y2="71"/>
    <line x1="232" y1="101" x2="392" y2="101"/>
    <line x1="232" y1="131" x2="392" y2="131"/>
    <line x1="232" y1="161" x2="392" y2="161"/>
  </g>
  <!-- Cohort mean -->
  <line x1="312" y1="56" x2="312" y2="176" stroke="#22F0FF" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>
  <text x="312" y="50" font-family="ui-monospace,monospace" font-size="7.5" fill="#5A6182" text-anchor="middle">COHORT MEAN</text>
  <g fill="#22F0FF" opacity="0.85">
    <circle cx="290" cy="71" r="2.5"/><circle cx="304" cy="71" r="2.5"/><circle cx="316" cy="71" r="2.5"/><circle cx="328" cy="71" r="2.5"/><circle cx="300" cy="71" r="2.5"/>
    <circle cx="296" cy="101" r="2.5"/><circle cx="310" cy="101" r="2.5"/><circle cx="320" cy="101" r="2.5"/><circle cx="334" cy="101" r="2.5"/><circle cx="306" cy="101" r="2.5"/>
    <circle cx="288" cy="161" r="2.5"/><circle cx="302" cy="161" r="2.5"/><circle cx="314" cy="161" r="2.5"/><circle cx="326" cy="161" r="2.5"/><circle cx="318" cy="161" r="2.5"/>
  </g>
  <!-- R3 drifts low -->
  <g fill="#FFC661">
    <circle cx="246" cy="131" r="2.5"/><circle cx="258" cy="131" r="2.5"/><circle cx="268" cy="131" r="2.5"/><circle cx="252" cy="131" r="2.5"/><circle cx="280" cy="131" r="2.5"/>
  </g>
  <rect x="238" y="122" width="50" height="18" fill="none" stroke="#FFC661" stroke-width="0.8" rx="3">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <text x="296" y="144" font-family="ui-monospace,monospace" font-size="7.5" fill="#FFC661">−0.8σ</text>

  <!-- RIGHT: fairness panel -->
  <g transform="translate(420, 30)" font-family="ui-monospace,monospace" font-size="9.5" fill="#DCE0EE">
    <text x="0" y="0" font-size="10" letter-spacing="0.12em" fill="#22F0FF">FAIRNESS INDEX</text>

    <g transform="translate(0, 18)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">RUBRIC</text>
      <rect x="64" y="2" width="58" height="6" fill="#2E3865" rx="1"/>
      <rect x="64" y="2" width="52" height="6" fill="#22F0FF" rx="1"/>
      <text x="150" y="9" font-size="8.5" text-anchor="end" fill="#FFFFFF">91</text>
    </g>
    <g transform="translate(0, 38)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">AGREEMENT</text>
      <rect x="64" y="2" width="58" height="6" fill="#2E3865" rx="1"/>
      <rect x="64" y="2" width="46" height="6" fill="#22F0FF" rx="1"/>
      <text x="150" y="9" font-size="8.5" text-anchor="end" fill="#FFFFFF">79</text>
    </g>
    <g transform="translate(0, 58)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">DRIFT</text>
      <rect x="64" y="2" width="58" height="6" fill="#2E3865" rx="1"/>
      <rect x="64" y="2" width="30" height="6" fill="#FFC661" rx="1"/>
      <text x="150" y="9" font-size="8.5" text-anchor="end" fill="#FFFFFF">R3</text>
    </g>
    <g transform="translate(0, 78)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">PARITY</text>
      <rect x="64" y="2" width="58" height="6" fill="#2E3865" rx="1"/>
      <rect x="64" y="2" width="50" height="6" fill="#22F0FF" rx="1"/>
      <text x="150" y="9" font-size="8.5" text-anchor="end" fill="#FFFFFF">88</text>
    </g>

    <line x1="0" y1="100" x2="150" y2="100" stroke="#2E3865" stroke-width="1"/>

    <g transform="translate(0, 120)">
      <text x="0" y="0" font-size="8.5" letter-spacing="0.1em" fill="#22F0FF">OUTCOME</text>
      <text x="0" y="22" font-size="22" font-weight="500" fill="#FFFFFF">RE-REVIEW</text>
      <text x="0" y="38" font-size="8" fill="#8E96B5">62 FILES · R3 SET</text>
    </g>

    <line x1="0" y1="160" x2="150" y2="160" stroke="#2E3865" stroke-width="1"/>
    <text x="0" y="178" font-size="8" letter-spacing="0.1em" fill="#8E96B5">RUBRIC · CONSISTENCY · PARITY</text>
  </g>
</svg>
