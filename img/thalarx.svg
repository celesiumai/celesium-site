<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;">
  <defs>
    <linearGradient id="tx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2748"/>
      <stop offset="100%" stop-color="#0D1224"/>
    </linearGradient>
    <radialGradient id="tx-spot" cx="0.8" cy="0.25" r="0.7">
      <stop offset="0%" stop-color="#22F0FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22F0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="240" fill="url(#tx-bg)"/>
  <rect width="600" height="240" fill="url(#tx-spot)"/>

  <!-- Revenue integrity — contracted vs paid, per line, underpayments flagged -->

  <!-- LEFT: remittance card -->
  <g transform="translate(36, 38)">
    <rect x="0" y="0" width="150" height="164" fill="#1A2244" stroke="#2E3865" stroke-width="1" rx="3"/>
    <text x="12" y="20" font-family="ui-monospace,monospace" font-size="9" letter-spacing="0.12em" fill="#22F0FF">REMITTANCE</text>
    <line x1="12" y1="28" x2="138" y2="28" stroke="#2E3865" stroke-width="1"/>

    <text x="12" y="46" font-family="ui-monospace,monospace" font-size="11" fill="#FFFFFF">Payer B · 835</text>
    <text x="12" y="60" font-family="ui-monospace,monospace" font-size="8.5" fill="#8E96B5">412 claim lines</text>

    <g font-family="ui-monospace,monospace" font-size="8" fill="#DCE0EE">
      <text x="12" y="84">contract</text>     <text x="138" y="84" text-anchor="end" fill="#FFFFFF">2026 rev. 3</text>
      <text x="12" y="100">lines matched</text> <text x="138" y="100" text-anchor="end" fill="#FFFFFF">412</text>
      <text x="12" y="116">paid in full</text>  <text x="138" y="116" text-anchor="end" fill="#FFFFFF">371</text>
      <text x="12" y="132">short-paid</text>    <text x="138" y="132" text-anchor="end" fill="#FFC661">38</text>
      <text x="12" y="148">denied</text>        <text x="138" y="148" text-anchor="end" fill="#FFC661">3</text>
    </g>
  </g>

  <!-- MIDDLE: contracted vs paid bars per code -->
  <g font-family="ui-monospace,monospace" font-size="7.5" fill="#8E96B5">
    <text x="214" y="52">CONTRACTED</text>
    <rect x="270" y="46" width="8" height="6" fill="#2E3865" rx="1"/>
    <text x="290" y="52">PAID</text>
    <rect x="314" y="46" width="8" height="6" fill="#22F0FF" rx="1"/>
  </g>
  <line x1="210" y1="190" x2="392" y2="190" stroke="#2E3865" stroke-width="1"/>
  <g>
    <!-- 99214 -->
    <rect x="218" y="92" width="14" height="98" fill="#2E3865" rx="1"/>
    <rect x="234" y="92" width="14" height="98" fill="#22F0FF" opacity="0.85" rx="1"/>
    <!-- 99215 (short) -->
    <rect x="262" y="70" width="14" height="120" fill="#2E3865" rx="1"/>
    <rect x="278" y="96" width="14" height="94" fill="#FFC661" opacity="0.9" rx="1"/>
    <!-- 93000 -->
    <rect x="306" y="134" width="14" height="56" fill="#2E3865" rx="1"/>
    <rect x="322" y="134" width="14" height="56" fill="#22F0FF" opacity="0.85" rx="1"/>
    <!-- 80053 (short) -->
    <rect x="350" y="112" width="14" height="78" fill="#2E3865" rx="1"/>
    <rect x="366" y="128" width="14" height="62" fill="#FFC661" opacity="0.9" rx="1"/>
  </g>
  <!-- Gap markers -->
  <g stroke="#FFC661" stroke-width="0.8" stroke-dasharray="2 2">
    <line x1="276" y1="70" x2="294" y2="70"/>
    <line x1="364" y1="112" x2="382" y2="112"/>
  </g>
  <circle cx="285" cy="70" r="3" fill="#FFC661">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="373" cy="112" r="3" fill="#FFC661">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <g font-family="ui-monospace,monospace" font-size="7.5" fill="#5A6182" text-anchor="middle">
    <text x="233" y="204">99214</text>
    <text x="277" y="204">99215</text>
    <text x="321" y="204">93000</text>
    <text x="365" y="204">80053</text>
  </g>

  <!-- RIGHT: variance panel -->
  <g transform="translate(420, 30)" font-family="ui-monospace,monospace" font-size="9.5" fill="#DCE0EE">
    <text x="0" y="0" font-size="10" letter-spacing="0.12em" fill="#22F0FF">VARIANCE</text>

    <g transform="translate(0, 18)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">EXPECTED</text>
      <text x="150" y="9" font-size="8.5" text-anchor="end" fill="#FFFFFF">$48,210</text>
    </g>
    <g transform="translate(0, 38)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">PAID</text>
      <text x="150" y="9" font-size="8.5" text-anchor="end" fill="#FFFFFF">$44,960</text>
    </g>
    <g transform="translate(0, 58)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">SHORT</text>
      <text x="150" y="9" font-size="8.5" text-anchor="end" fill="#FFC661">$3,250</text>
    </g>
    <g transform="translate(0, 78)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">RECOVERY</text>
      <rect x="64" y="2" width="58" height="6" fill="#2E3865" rx="1"/>
      <rect x="64" y="2" width="48" height="6" fill="#22F0FF" rx="1"/>
      <text x="150" y="9" font-size="8.5" text-anchor="end" fill="#FFFFFF">83%</text>
    </g>

    <line x1="0" y1="100" x2="150" y2="100" stroke="#2E3865" stroke-width="1"/>

    <g transform="translate(0, 120)">
      <text x="0" y="0" font-size="8.5" letter-spacing="0.1em" fill="#22F0FF">ACTION</text>
      <text x="0" y="22" font-size="22" font-weight="500" fill="#FFFFFF">APPEAL</text>
      <text x="0" y="38" font-size="8" fill="#8E96B5">41 LINES · CITED</text>
    </g>

    <line x1="0" y1="160" x2="150" y2="160" stroke="#2E3865" stroke-width="1"/>
    <text x="0" y="178" font-size="8" letter-spacing="0.1em" fill="#8E96B5">835 · CONTRACT · FEE SCHEDULE</text>
  </g>
</svg>
